name: Deploy Analyzer.pro to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate website JavaScript
        run: node -e "const fs=require('fs'),vm=require('vm'),html=fs.readFileSync('public/index.html','utf8'),m=html.match(/<script>([\\s\\S]*?)<\\/script>/);if(!m)throw Error('Website script not found');new vm.Script(m[1]);console.log('Website JavaScript syntax is valid')"

      - name: Deploy Worker and static assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 97a1cb0a4208a3101ab6b405cd9479f0
          wranglerVersion: "4"
          command: deploy
